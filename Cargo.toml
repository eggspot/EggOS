[workspace]
resolver = "3"
members = ["kernel", "hal", "drivers", "font", "eggfs", "settings-file", "app-manifest", "userland/runtime", "userland/init", "userland/eggsh", "userland/coreutils", "userland/hello-window", "userland/toolkit", "userland/settings", "userland/selftest", "userland/std-selftest", "userland/windows", "userland/windows-gui", "userland/macos", "tests/linux-static", "tests/windows-console", "tests/windows-gui", "tests/android-console", "tests/macos-console", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggOS"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = true
codegen-units = 1
