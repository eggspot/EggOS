[workspace]
resolver = "3"
members = ["kernel", "hal", "drivers", "font", "terminal", "calendar", "eggfs", "net", "crypto", "tls", "settings-file", "app-manifest", "png", "wayland", "userland/runtime", "userland/c-format", "userland/init", "userland/eggsh", "userland/commands", "userland/element-tree", "userland/coreutils", "userland/hello-window", "userland/toolkit", "userland/settings", "userland/app", "userland/files", "userland/editor", "userland/mcp", "userland/eggway", "userland/selftest", "userland/std-selftest", "userland/windows", "userland/windows-gui", "userland/macos", "userland/macos-gui", "tests/linux-static", "tests/linux-sockets", "tests/linux-memory", "tests/linux-mappings", "tests/linux-events", "tests/linux-dynamic", "tests/linux-udp", "tests/linux-tcp", "tests/linux-gui", "tests/build-timer", "tests/windows-console", "tests/windows-gui", "tests/android-console", "tests/macos-console", "tests/macos-gui", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggOS"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = true
codegen-units = 1
