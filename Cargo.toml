[workspace]
resolver = "3"
members = ["kernel", "hal", "drivers", "userland/runtime", "userland/init", "userland/eggsh", "userland/coreutils", "userland/selftest", "userland/std-selftest", "tests/linux-static", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eggspot/EggOS"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = true
codegen-units = 1
