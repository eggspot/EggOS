[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
eggos-app = { path = "../userland/app", features = ["window"] }
eggos-editor = { path = "../userland/editor", features = ["window"] }
eggos-files = { path = "../userland/files", features = ["window", "memory"] }
eggos-mcp = { path = "../userland/mcp", features = ["fuzz"] }
eggos-eggway = { path = "../userland/eggway", features = ["fuzz"] }
eggos-linux-gui-tests = { path = "../tests/linux-gui" }
eggos-macos-gui-tests = { path = "../tests/macos-gui" }
eggos-wayland = { path = "../wayland" }
eggos-app-manifest = { path = "../app-manifest" }
eggos-calendar = { path = "../calendar" }
eggos-net = { path = "../net" }
eggos-drivers = { path = "../drivers" }
eggos-eggfs = { path = "../eggfs" }
eggos-png = { path = "../png" }
eggos-settings = { path = "../userland/settings" }
eggos-settings-file = { path = "../settings-file" }
eggos-toolkit = { path = "../userland/toolkit" }
eggos-windows-gui = { path = "../userland/windows-gui" }
eggos-windows-gui-tests = { path = "../tests/windows-gui" }

[lints]
workspace = true
