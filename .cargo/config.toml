[alias]
xtask = "run --quiet --package xtask --"

[target.aarch64-unknown-none-softfloat]
rustflags = ["--cfg", "eggos_kernel"]

[target.riscv64imac-unknown-none-elf]
rustflags = ["--cfg", "eggos_kernel"]

[target.loongarch64-unknown-none-softfloat]
rustflags = ["--cfg", "eggos_kernel"]

[target.powerpc64le-unknown-linux-gnu]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "target-feature=-altivec,-vsx,-hard-float,+soft-float",
    "-C", "link-arg=-zmax-page-size=0x10000",
    "--cfg", "eggos_kernel",
]

[target.mips64el-unknown-linux-gnuabi64]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "target-feature=+soft-float,+noabicalls",
    "--cfg", "eggos_kernel",
]

[target.s390x-unknown-linux-gnu]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "target-feature=-vector,+soft-float",
    "--cfg", "eggos_kernel",
]

[target.sparcv9-sun-solaris]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "code-model=medium",
    "-C", "target-feature=+soft-float",
    "--cfg", "eggos_kernel",
]

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "--cfg", "eggos_kernel"]

[target.x86_64-unknown-uefi]
rustflags = ["--cfg", "eggos_uefi"]

[target.aarch64-unknown-uefi]
rustflags = ["--cfg", "eggos_uefi"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.riscv64gc-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.loongarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.powerpc64le-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.mips64el-unknown-linux-muslabi64]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.s390x-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]

[target.sparc64-unknown-linux-gnu]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no", "-C", "relocation-model=pie", "--cfg", "eggos_user"]
