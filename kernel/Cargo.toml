[package]
name = "eggos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eggos-calendar = { path = "../calendar" }
eggos-drivers = { path = "../drivers" }
eggos-eggfs = { path = "../eggfs" }
eggos-gpt = { path = "../gpt" }
eggos-hal = { path = "../hal" }
eggos-net = { path = "../net" }
eggos-settings-file = { path = "../settings-file" }
eggos-android-properties = { path = "../android-properties" }
eggos-android-log = { path = "../android-log" }
eggos-app-manifest = { path = "../app-manifest" }
eggos-wayland = { path = "../wayland" }
eggos-translate = { path = "../translate" }
eggos-element-tree = { path = "../userland/element-tree" }
eggos-toolkit = { path = "../userland/toolkit", optional = true }
eggos-image = { path = "../image", optional = true }
eggos-math = { path = "../math", optional = true }

[dev-dependencies]
eggos-toolkit = { path = "../userland/toolkit" }
eggos-image = { path = "../image" }
eggos-math = { path = "../math" }

[lints]
workspace = true

[features]
default = ["virtio-gpu", "virtio-input", "virtio-blk", "virtio-console", "virtio-net", "rtc", "nvme", "ahci"]
virtio = []
virtio-gpu = ["virtio"]
virtio-input = ["virtio"]
virtio-rng = ["virtio"]
virtio-blk = ["virtio"]
virtio-console = ["virtio"]
virtio-net = ["virtio"]
rtc = []
nvme = []
ahci = []
qemu-test = ["virtio-gpu", "virtio-input", "virtio-rng", "virtio-blk", "virtio-console", "virtio-net", "rtc", "nvme", "ahci"]
qemu-test-fatal-exception = ["qemu-test"]
qemu-bench = ["qemu-test", "dep:eggos-toolkit", "dep:eggos-image", "dep:eggos-math"]
qemu-boot-clock = []
