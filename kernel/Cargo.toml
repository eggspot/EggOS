[package]
name = "eggos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eggos-hal = { path = "../hal" }

[lints]
workspace = true

[features]
# Power the machine off after boot so the QEMU test runner sees the verdict.
qemu-test = []
# Also execute an illegal instruction after the self-tests pass, to test that a fatal exception
# is reported with the fail marker (the QEMU runner then expects that failure).
qemu-test-fatal-exception = ["qemu-test"]
