[package]
name = "eggos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eggos-drivers = { path = "../drivers" }
eggos-eggfs = { path = "../eggfs" }
eggos-hal = { path = "../hal" }
eggos-settings-file = { path = "../settings-file" }
eggos-app-manifest = { path = "../app-manifest" }

[lints]
workspace = true

[features]
default = ["virtio-gpu", "virtio-input", "virtio-blk"]
virtio = []
virtio-gpu = ["virtio"]
virtio-input = ["virtio"]
virtio-rng = ["virtio"]
virtio-blk = ["virtio"]
qemu-test = ["virtio-gpu", "virtio-input", "virtio-rng", "virtio-blk"]
qemu-test-fatal-exception = ["qemu-test"]
qemu-bench = ["qemu-test"]
qemu-boot-clock = []
