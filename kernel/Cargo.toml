[package]
name = "eggos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
eggos-hal = { path = "../hal" }

[lints]
workspace = true

[features]
# Power the machine off after boot so the QEMU test runner sees the verdict.
qemu-test = []
# After the self-tests pass, also write to the kernel's read-only data, to test that it faults
# and that the fatal exception is reported with the fail marker (the QEMU runner then expects
# that failure, at that address).
qemu-test-fatal-exception = ["qemu-test"]
# After the self-tests pass, run the boot-time benchmarks and print their results (read by
# `cargo xtask bench`, which boots with `-icount shift=0`).
qemu-bench = ["qemu-test"]
