name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag is a release version
        run: echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Build and boot the release image of every architecture
        run: cargo xtask release

      - name: Check the version matches the tag
        run: |
          version="${TAG#v}"
          for arch in aarch64 riscv64 x86_64; do
            test -f "target/release-dist/eggos-${version}-${arch}.elf"
            test -f "target/release-dist/eggos-${version}-${arch}-components.img"
          done
          test -f "docs/releases/${TAG}.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q false; then
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --repo "$GITHUB_REPOSITORY" \
              --title "EggOS ${TAG#v}" \
              --notes-file "docs/releases/${TAG}.md"
          fi
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            target/release-dist/eggos-*.elf \
            target/release-dist/eggos-*-components.img \
            target/release-dist/SHA256SUMS \
            target/release-dist/run-eggos.sh \
            target/release-dist/run-eggos.ps1
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/${TAG}.md" --draft=false
