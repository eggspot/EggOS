name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Build and boot the release image of every architecture
        run: cargo xtask release

      - name: Check the version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in aarch64 riscv64 x86_64; do
            test -f "target/release-dist/eggos-${version}-${arch}.elf"
          done
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/release-dist/eggos-*.elf \
            target/release-dist/SHA256SUMS \
            target/release-dist/run-eggos.sh \
            target/release-dist/run-eggos.ps1 \
            --repo "$GITHUB_REPOSITORY" \
            --title "EggOS ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
