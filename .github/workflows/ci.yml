name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq ".[].filename")
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping checks."
          fi

  fast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-fast-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-fast-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Lint (comments the repository rules disallow)
        run: cargo xtask lint

      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (kernel targets)
        run: cargo xtask clippy-targets

      - name: Docs (rustdoc, warnings as errors)
        run: cargo xtask docs

      - name: Unit tests (host)
        run: cargo test --workspace

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: target
          key: target-${{ runner.os }}-fast-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}

  qemu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/local/lib/android/sdk/ndk:/usr/local/lib/android/sdk/ndk:ro
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: QEMU boot tests
        env:
          GH_TOKEN: ${{ github.token }}
          EGGOS_MACOS_PROGRAMS: ${{ github.event_name == 'pull_request' && 'target/macos-programs' || '' }}
          EGGOS_WINDOWS_PROGRAMS: ${{ github.event_name == 'pull_request' && matrix.arch != 'riscv64' && 'target/windows-programs' || '' }}
        run: cargo xtask qemu --arch ${{ matrix.arch }}

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}

  dynamic-linking:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install the glibc target and cross compilers (test data only, never shipped)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu
          rustup target add ${{ matrix.arch == 'riscv64' && 'riscv64gc' || matrix.arch }}-unknown-linux-gnu

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Dynamically linked glibc and musl programs boot
        run: cargo xtask dynamic-linking --arch ${{ matrix.arch }}

  static-glibc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install the glibc target and cross compilers (test data only, never shipped)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libc6-dev gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu
          rustup target add ${{ matrix.arch == 'riscv64' && 'riscv64gc' || matrix.arch }}-unknown-linux-gnu

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Static glibc programs and static PIEs boot
        run: cargo xtask static-glibc --arch ${{ matrix.arch }}

  android-dynamic:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/local/lib/android/sdk/ndk:/usr/local/lib/android/sdk/ndk:ro
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Dynamically linked Android programs boot
        run: cargo xtask android-dynamic --arch ${{ matrix.arch }}

  rustc-version:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install xz and the aarch64 C library (test data only, never shipped)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils gcc-aarch64-linux-gnu

      - name: Install the arm64 libraries rustc may load (test data only, never shipped)
        if: matrix.arch == 'aarch64'
        run: |
          dpkg --add-architecture arm64
          sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates\nComponents: main\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > /etc/apt/sources.list.d/arm64.sources
          apt-get update
          apt-get install -y --no-install-recommends zlib1g:arm64 libgcc-s1:arm64

      - uses: actions/cache@v6
        with:
          path: target/rustc-version/downloads
          key: rustc-version-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'xtask/src/rustc_version.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: The official rustc runs rustc --version inside EggOS
        run: cargo xtask rustc-version --arch ${{ matrix.arch }}

  hello-crate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install xz, the aarch64 C library and Linux's user-mode QEMU (test data and tools only, never shipped)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils gcc-aarch64-linux-gnu qemu-user

      - name: Install the arm64 libraries the toolchain may load (test data only, never shipped)
        if: matrix.arch == 'aarch64'
        run: |
          dpkg --add-architecture arm64
          sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates\nComponents: main\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > /etc/apt/sources.list.d/arm64.sources
          apt-get update
          apt-get install -y --no-install-recommends zlib1g:arm64 libgcc-s1:arm64

      - uses: actions/cache@v6
        with:
          path: target/hello-crate/downloads
          key: hello-crate-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'xtask/src/rustc_version.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: cargo builds and runs a hello-world crate inside EggOS, printing what it prints on Linux
        run: cargo xtask hello-crate --arch ${{ matrix.arch }}

  workspace-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install xz and the aarch64 C library (test data and tools only, never shipped)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xz-utils gcc-aarch64-linux-gnu

      - name: Install the arm64 libraries the toolchain may load (test data only, never shipped)
        if: matrix.arch == 'aarch64'
        run: |
          dpkg --add-architecture arm64
          sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates\nComponents: main\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > /etc/apt/sources.list.d/arm64.sources
          apt-get update
          apt-get install -y --no-install-recommends zlib1g:arm64 libgcc-s1:arm64

      - uses: actions/cache@v6
        with:
          path: target/workspace-build/downloads
          key: workspace-build-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'xtask/src/rustc_version.rs', 'xtask/src/workspace_build.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: cargo builds a multi-crate workspace inside EggOS and inside Linux in the same QEMU machine, timed against each other in the job summary
        run: cargo xtask workspace-build --arch ${{ matrix.arch }}

  sdl3:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: cache
        uses: actions/cache@v6
        with:
          path: target/sdl-app/sdl3-${{ matrix.arch }}
          key: sdl3-${{ matrix.arch }}-${{ hashFiles('xtask/src/sdl_app.rs') }}

      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup toolchain install

      - name: Build SDL's pinned commit for Alpine's musl in an alpine:3.24 container on this CPU (test data only, never shipped)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask sdl3 --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: sdl3-${{ matrix.arch }}
          path: target/sdl-app/sdl3-${{ matrix.arch }}
          retention-days: 1

  sdl-app:
    needs: [changes, sdl3]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/sdl-app/downloads-${{ matrix.arch }}
          key: sdl-app-${{ matrix.arch }}-${{ hashFiles('xtask/src/sdl_app.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - uses: actions/download-artifact@v7
        with:
          name: sdl3-${{ matrix.arch }}
          path: target/sdl-app/sdl3-${{ matrix.arch }}

      - name: A real SDL app, Brogue CE, installs, opens, plays a few turns, saves and closes inside EggOS
        run: cargo xtask sdl-app --arch ${{ matrix.arch }}

  win32-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/win32-app
          key: win32-app-${{ hashFiles('xtask/src/win32_app.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: A real classic Win32 app, Pegs from Simon Tatham's Puzzles, installs, opens, plays, undoes, changes its board, opens its dialogs and quits inside EggOS (x64 only, the app ships no ARM64 build)
        run: cargo xtask win32-app --arch x86_64

  autohotkey:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/autohotkey
          key: autohotkey-${{ hashFiles('xtask/src/autohotkey.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-x86_64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: A real Win32 app on common controls, GDI+ and COM, AutoHotkey v2, installs, runs our script's window, drives its list, toolbar, tabs and tree, shows its element tree and closes inside EggOS (x64 only, the app ships no ARM64 build)
        run: cargo xtask autohotkey --arch x86_64

  cocoa-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/cocoa-app
          key: cocoa-app-${{ matrix.arch }}-${{ hashFiles('xtask/src/cocoa_app.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: A real Objective-C Mac app, CocoaGame, installs from its .zip, opens, plays, shows its element tree and About panel, and quits inside EggOS
        run: cargo xtask cocoa-app --arch ${{ matrix.arch }}

  gtk-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/gtk-app/downloads-${{ matrix.arch }}
          key: gtk-app-${{ matrix.arch }}-${{ hashFiles('xtask/src/gtk_app.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: A real GTK app, Mousepad, installs from its .zip with its environment and fonts, opens, edits, copies and pastes, saves and quits inside EggOS
        run: cargo xtask gtk-app --arch ${{ matrix.arch }}

  qt-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: target/qt-app/downloads-${{ matrix.arch }}
          key: qt-app-${{ matrix.arch }}-${{ hashFiles('xtask/src/qt_app.rs') }}

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-qemu-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: A real Qt app, CorePad, installs from its .zip with its environment, plugins and fonts, opens, edits, copies and pastes, saves as through its file dialog and quits inside EggOS
        run: cargo xtask qt-app --arch ${{ matrix.arch }}

  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64, x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-bench-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-bench-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Benchmarks against the baseline (report only, a result over 2x slower fails)
        run: cargo xtask bench --arch ${{ matrix.arch }} --report-only

      - name: Report the benchmarks in the job summary
        if: always()
        run: |
          if [ -f target/bench/report.md ]; then cat target/bench/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the benchmark results of this commit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) || format('main-{0}', github.sha) }}-${{ matrix.arch }}
          path: |
            target/bench/report.json
            target/bench/report.md
          retention-days: 90
          if-no-files-found: ignore

      - uses: actions/cache/save@v6
        if: github.event_name == 'push'
        with:
          path: target
          key: target-${{ runner.os }}-bench-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}

  macos-programs:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq ".[].filename")
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: no Mach-O programs to build."
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.code == 'true'
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - name: Build the Mach-O test programs with Apple's linker
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask macos-programs
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: macos-programs
          path: target/macos-console/programs
          retention-days: 1
          if-no-files-found: error

  windows-programs:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq ".[].filename")
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: no MSVC programs to build."
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.code == 'true'
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - name: Build the C runtime test programs with MSVC
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask windows-programs
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: windows-programs
          path: target/windows-crt/programs
          retention-days: 1
          if-no-files-found: error

  hosts:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests (host)
        run: cargo test --workspace
      - name: Build the kernel for every architecture
        shell: bash
        run: for arch in aarch64 riscv64 x86_64; do cargo xtask build --arch "$arch"; done

  run-scripts-windows:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Detect run script and MCP channel changes
        id: scripts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq ".[].filename")
          if echo "$files" | grep -qE '^(xtask/src/release\.rs|xtask/src/qemu|userland/mcp/|kernel/src/agent_channel\.rs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No change to the run scripts or the MCP channel: run-eggos.ps1 not booted."
          fi
      - uses: actions/checkout@v7
        if: steps.scripts.outputs.run == 'true'
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.scripts.outputs.run == 'true'
        run: rustup toolchain install
      - name: Install QEMU
        if: steps.scripts.outputs.run == 'true'
        run: choco install qemu --no-progress -y
      - name: Boot the release image through run-eggos.ps1 (serial, host folder, MCP)
        if: steps.scripts.outputs.run == 'true'
        run: cargo xtask run-scripts --arch x86_64

  check:
    if: always()
    needs: [changes, fast, qemu, dynamic-linking, static-glibc, android-dynamic, rustc-version, hello-crate, workspace-build, sdl3, sdl-app, win32-app, autohotkey, cocoa-app, gtk-app, qt-app, bench, macos-programs, windows-programs, hosts, run-scripts-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1;;
          esac
