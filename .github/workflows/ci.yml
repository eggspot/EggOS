name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
      actions: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/local/lib/android/sdk/ndk:/usr/local/lib/android/sdk/ndk:ro
    timeout-minutes: 25
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only)
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping checks."
          fi

      - uses: actions/checkout@v7
        if: steps.changes.outputs.code == 'true'
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Format
        if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check

      - name: Clippy (host)
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (kernel targets)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask clippy-targets

      - name: Docs (rustdoc, warnings as errors)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask docs

      - name: Unit tests (host)
        if: steps.changes.outputs.code == 'true'
        run: cargo test --workspace

      - name: Wait for the Mach-O test programs
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=${{ github.run_id }}; repo=${{ github.repository }}
          for attempt in $(seq 1 120); do
            if gh api "repos/$repo/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx macos-programs; then
              gh run download "$run" --repo "$repo" --name macos-programs --dir target/macos-programs
              exit 0
            fi
            state=$(gh api "repos/$repo/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "macos-programs") | .conclusion // ""')
            case "$state" in
              failure|cancelled|skipped|timed_out) echo "macos-programs: $state"; exit 1;;
              success) gh api "repos/$repo/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qx macos-programs || { echo "macos-programs finished without its artifact"; exit 1; };;
            esac
            sleep 5
          done
          echo "macos-programs: no artifact after 10 minutes"; exit 1

      - name: QEMU boot tests (every architecture)
        if: steps.changes.outputs.code == 'true'
        env:
          EGGOS_MACOS_PROGRAMS: ${{ github.event_name == 'pull_request' && 'target/macos-programs' || '' }}
        run: cargo xtask qemu --arch all

      - name: Benchmarks against the baseline (every architecture)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask bench --arch all

      - uses: actions/cache/save@v6
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push'
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}

  macos-programs:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only)
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: no Mach-O programs to build."
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.code == 'true'
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - name: Build the Mach-O test programs with Apple's linker
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask macos-programs
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          name: macos-programs
          path: target/macos-console/programs
          retention-days: 1
          if-no-files-found: error

  hosts:
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.code == 'true'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests (host)
        run: cargo test --workspace
      - name: Build the kernel for every architecture
        shell: bash
        run: for arch in aarch64 riscv64 x86_64; do cargo xtask build --arch "$arch"; done
