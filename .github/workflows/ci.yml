name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /usr/local/lib/android/sdk/ndk:/usr/local/lib/android/sdk/ndk
    timeout-minutes: 25
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --name-only)
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE(-MIT|-APACHE)?$|^\.github/FUNDING\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs-only change: skipping checks."
          fi

      - uses: actions/checkout@v7
        if: steps.changes.outputs.code == 'true'
        with:
          fetch-depth: 1

      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Probe
        run: cargo xtask qemu --arch aarch64 || cargo xtask qemu --arch x86_64 || true

      - name: Format
        if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check

      - name: Clippy (host)
        if: steps.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (kernel targets)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask clippy-targets

      - name: Docs (rustdoc, warnings as errors)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask docs

      - name: Unit tests (host)
        if: steps.changes.outputs.code == 'true'
        run: cargo test --workspace

      - name: QEMU boot tests (every architecture)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask qemu --arch all

      - name: Benchmarks against the baseline (every architecture)
        if: steps.changes.outputs.code == 'true'
        run: cargo xtask bench --arch all

      - uses: actions/cache/save@v6
        if: steps.changes.outputs.code == 'true' && github.event_name == 'push'
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}

  hosts:
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.code == 'true'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests (host)
        run: cargo test --workspace
      - name: Build the kernel for every architecture
        shell: bash
        run: for arch in aarch64 riscv64 x86_64; do cargo xtask build --arch "$arch"; done
