name: Tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/eggspot/eggos-ci:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sign tags as the Actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-xtask-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          restore-keys: |
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Decide and tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release-tag "$SHA" --push

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
