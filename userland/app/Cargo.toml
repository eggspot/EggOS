[package]
name = "eggos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "app"
path = "src/main.rs"

[features]
window = ["dep:eggos-toolkit"]

[dependencies]
eggos-app-manifest = { path = "../../app-manifest" }
eggos-commands = { path = "../commands" }
eggos-mcp = { path = "../mcp" }
eggos-png = { path = "../../png" }
eggos-runtime = { path = "../runtime" }
eggos-toolkit = { path = "../toolkit", optional = true }

[lints]
workspace = true
