[package]
name = "eggos-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "windows"
path = "src/main.rs"

[dependencies]
eggos-c-format = { path = "../c-format" }
eggos-calendar = { path = "../../calendar" }
eggos-element-tree = { path = "../element-tree" }
eggos-net = { path = "../../net" }
eggos-png = { path = "../../png" }
eggos-runtime = { path = "../runtime" }
eggos-settings-file = { path = "../../settings-file" }
eggos-translation-loader = { path = "../translation-loader" }
eggos-windows-gui = { path = "../windows-gui" }

[target.'cfg(any(target_arch = "aarch64", not(target_env = "musl")))'.dependencies]
eggos-translate = { path = "../../translate" }

[lints]
workspace = true
