[package]
name = "eggos-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "windows"
path = "src/main.rs"

[dependencies]
eggos-c-format = { path = "../c-format" }
eggos-calendar = { path = "../../calendar" }
eggos-drivers = { path = "../../drivers" }
eggos-element-tree = { path = "../element-tree" }
eggos-image = { path = "../../image" }
eggos-math = { path = "../../math" }
eggos-net = { path = "../../net" }
eggos-png = { path = "../../png" }
eggos-runtime = { path = "../runtime" }
eggos-settings-file = { path = "../../settings-file" }
eggos-tls = { path = "../../tls" }
eggos-translation-loader = { path = "../translation-loader" }
eggos-windows-gui = { path = "../windows-gui" }
eggos-windows-registry = { path = "../windows-registry" }

[target.'cfg(any(target_arch = "aarch64", not(eggos_user)))'.dependencies]
eggos-translate = { path = "../../translate" }

[lints]
workspace = true
